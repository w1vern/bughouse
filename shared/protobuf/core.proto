syntax = "proto3";
package process;

service CoreService {
  // Lobby (no SeatPlayer/UnseatPlayer/JoinLobby — joining is invite-only)
  rpc CreateLobby(CreateLobbyReq)   returns (StatusResp);
  rpc LeaveLobby(UserRef)           returns (StatusResp);
  rpc KickFromLobby(KickReq)        returns (StatusResp);
  rpc SetLobbyConfig(SetConfigReq)  returns (StatusResp);
  rpc StartMatchmaking(UserRef)     returns (StatusResp);
  rpc CancelMatchmaking(UserRef)    returns (StatusResp);

  // Invites (lobby leader only)
  rpc SendInvite(SendInviteReq)     returns (StatusResp);
  rpc AcceptInvite(AcceptInviteReq) returns (StatusResp);
  rpc RejectInvite(RejectInviteReq) returns (StatusResp);

  // Game
  rpc MakeMove(MoveReq)             returns (StatusResp);
  rpc Resign(UserRef)               returns (StatusResp);
  rpc SendChat(ChatReq)             returns (StatusResp);

  // Sync — returns the full SYNC payload (WsSyncData) as JSON
  rpc GetUserSnapshot(UserRef)      returns (SnapshotResp);

  // Stats
  rpc GetStats(StatsReq)            returns (StatsResp);
}

// ---------- Refs / requests ----------
message UserRef          { string username = 1; }

message CreateLobbyReq   {
  string username     = 1;
  int32  clock_time   = 2;
  int32  incr         = 3;
}

message KickReq          { string leader = 1; string target = 2; }

message SetConfigReq {
  string leader       = 1;
  int32  clock_time   = 2;
  int32  incr         = 3;
  bool   rated        = 4;
}

message MoveReq          { string username = 1; string uci = 2; }
message ChatReq          { string username = 1; string text = 2; }

message SendInviteReq    { string sender = 1; string receiver = 2; int32 idx = 3; }
message AcceptInviteReq  { string receiver = 1; string sender = 2; }
message RejectInviteReq  { string receiver = 1; string sender = 2; }
message StatsReq         {}

// ---------- Responses ----------
message StatusResp {
  bool   ok         = 1;
  string error_code = 2;
  string message    = 3;
}

message SnapshotResp {
  bool   ok            = 1;
  string error_code    = 2;
  string message       = 3;
  // JSON-serialized WsSyncData ({state, lobby?, game?}); empty if !ok.
  string sync_json     = 4;
}

message StatsResp {
  bool   ok                = 1;
  string error_code        = 2;
  string message           = 3;
  int32  online_users      = 4;
  int32  available_players = 5;
  int32  queued_players    = 6;
  int32  queued_lobbies    = 7;
  int32  active_games      = 8;
}
