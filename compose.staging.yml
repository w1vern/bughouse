services:
  watchtower:
    image: nickfedor/watchtower
    command: --http-api-update
    environment:
      - WATCHTOWER_HTTP_API_TOKEN=${DEPLOY_WEBHOOK_SECRET}
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres -c log_statement=all -c log_duration=on -c log_min_duration_statement=0 -c logging_collector=off -c client_min_messages=log -c log_error_verbosity=default
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  backend:
    image: ghcr.io/w1vern/bughouse:staging
    env_file:
      - .env
    command: python -m services.backend
    depends_on:
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://backend:8000/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    profiles:
      - with_backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  core:
    image: ghcr.io/w1vern/bughouse:staging
    env_file:
      - .env
    command: python -m services.core
    depends_on:
      redis:
        condition: service_healthy
      alembic:
        condition: service_completed_successfully
    profiles:
      - with_backend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  alembic:
    image: ghcr.io/w1vern/bughouse:staging
    command: alembic -c services/alembic/alembic.ini upgrade head
    restart: no
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  frontend:
    image: ghcr.io/immortalai/bugchess-vue:staging
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy
    profiles:
      - with_frontend
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  nginx:
    image: nginx:latest
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs/nginx:/var/log/nginx/
    profiles:
      - with_backend
    restart: unless-stopped
    ports:
      - ${NGINX_PORT}:80

volumes:
  postgres_data:
  redis_data:
